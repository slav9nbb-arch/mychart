# Source: nginx/templates/service.yaml
kind: Service
apiVersion: v1
metadata:
  name: nginx
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      name: proxy
      nodePort: 31002
  selector:
    k8s-app: nginx
---
# Source: nginx/templates/deployment.yaml
kind: Deployment
apiVersion: apps/v1
metadata:
  name: ngapp
  labels:
    helm.sh/chart: nginx-0.1.0
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
  annotations:
    reloader.stakater.com/auto: "true"
    configmap.reloader.stakater.com/reload: ngapp-conf,ngapp-html
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx
      app.kubernetes.io/instance: app
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "80"
        prometheus.io/scrape: "true"
      labels:
        app.kubernetes.io/name: nginx
        app.kubernetes.io/instance: app
    spec:
      containers:
        - name: ngapp
          image: "nginx:centos-rpm"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          LivenessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            limits:
              cpu: "0.2"
              memory: 400Mi
            requests:
              cpu: "0.1"
              memory: 200Mi
          volumeMounts:
            - name: html
              mountPath: /usr/local/nginx/nginx/html/
            - name: config
              mountPath: /etc/nginx/conf.d/
      volumes:
        - name: html
          configMap:
            name: nginx-html
        - name: config
          configMap:
            name: nginx-conf
---
# Source: nginx/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ngapp
  labels:
    helm.sh/chart: nginx-0.1.0
    app.kubernetes.io/name: nginx
    app.kubernetes.io/instance: app
    app.kubernetes.io/version: "1.19.9.1-centos-rpm"
    app.kubernetes.io/managed-by: Helm
  annotations:
    certmanager.k8s.io/cluster-issuer: monitoring-issuer
spec:
  ingressClassName: system-ingress
  tls:
    - hosts:
        - "application"
      secretName: my-tls
  rules:
    - host: "application.slava.local"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ngapp-svc
                port:
                  number: 80
